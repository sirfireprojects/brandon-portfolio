<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
  <title id="title">Portrait placeholder for Brandon Kibochi</title>
  <desc id="desc">Stylised initials placeholder. Replace with a professional portrait photograph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="55%" stop-color="#15345C"/>
      <stop offset="100%" stop-color="#1A56DB"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="800" fill="url(#bg)"/>
  <rect width="640" height="800" fill="url(#sheen)"/>
  <circle cx="480" cy="120" r="180" fill="#FFFFFF" fill-opacity="0.04"/>
  <circle cx="80" cy="680" r="220" fill="#FFFFFF" fill-opacity="0.05"/>
  <text x="320" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="168" font-weight="700" fill="#FFFFFF" fill-opacity="0.95">BK</text>
  <text x="320" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.7">KIBOCHI</text>
</svg>
